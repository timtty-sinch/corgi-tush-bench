<script type="module">
/* ============================================================================
   Pembroke Welsh Corgi, rear view. Procedural, single file.
   three.js r160 (pinned) is the only external dependency.
   ========================================================================== */
let THREE = null;
for (const u of [
  'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js',
  'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js'
]) { try { THREE = await import(u); break; } catch (e) { /* try next */ } }
if (!THREE) throw new Error('three.js could not be loaded');

const DEBUG = /debug/.test(location.hash);

/* ------------------------------------------------------------------ utils */
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const mix = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const u = clamp((x - a) / (b - a), 0, 1); return u * u * (3 - 2 * u); };
const rnd = (a, b) => a + Math.random() * (b - a);
function smin(a, b, k) { const h = Math.max(k - Math.abs(a - b), 0) / k; return Math.min(a, b) - h * h * k * 0.25; }
function smax(a, b, k) { return -smin(-a, -b, k); }

function hash3(ix, iy, iz) {
  let h = Math.imul(ix, 374761393) + Math.imul(iy, 668265263) + Math.imul(iz, 1274126177);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h = h ^ (h >>> 16);
  return (h >>> 0) / 4294967295;
}
function vnoise(x, y, z) {
  const ix = Math.floor(x), iy = Math.floor(y), iz = Math.floor(z);
  let fx = x - ix, fy = y - iy, fz = z - iz;
  fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy); fz = fz * fz * (3 - 2 * fz);
  const a = hash3(ix, iy, iz), b = hash3(ix + 1, iy, iz), c = hash3(ix, iy + 1, iz), d = hash3(ix + 1, iy + 1, iz);
  const e = hash3(ix, iy, iz + 1), f = hash3(ix + 1, iy, iz + 1), g = hash3(ix, iy + 1, iz + 1), hh = hash3(ix + 1, iy + 1, iz + 1);
  return mix(mix(mix(a, b, fx), mix(c, d, fx), fy), mix(mix(e, f, fx), mix(g, hh, fx), fy), fz);
}

/* ------------------------------------------------------------------ coat */
const COATS = ['rw', 'sable', 'tri', 'bht'];
let COAT;
{
  const m = /coat=(\w+)/.exec(location.hash);
  const r = Math.random();
  COAT = (m && COATS.includes(m[1])) ? m[1] : (r < 0.38 ? 'rw' : r < 0.64 ? 'sable' : r < 0.86 ? 'tri' : 'bht');
}
const lin = c => c.map(v => Math.pow(v, 2.2));
const mix3 = (a, b, t) => a.map((v, i) => mix(v, b[i], t));
const PAL = (() => {
  const rich = [0.66, 0.235, 0.065], golden = [0.76, 0.38, 0.12], fawn = [0.79, 0.52, 0.26];
  let red = mix3(rich, golden, Math.random() * 0.85);
  if (COAT === 'sable') red = mix3(mix3(rich, golden, 0.7), fawn, 0.15 + Math.random() * 0.35);
  if (COAT === 'tri' || COAT === 'bht') red = mix3([0.66, 0.34, 0.14], [0.76, 0.45, 0.20], Math.random());
  return {
    white: lin([0.94, 0.91, 0.865]),
    black: lin([0.085, 0.075, 0.07]),
    under: lin(mix3([0.88, 0.70, 0.48], red, 0.45)),
    red: lin(red)
  };
})();

/* ------------------------------------------------------- SDF body (rest pose)
   Units: 1 = 10 cm. Ground y = 0. Dog faces -z, the rump is toward +z.        */
function sdEllipsoid(px, py, pz, cx, cy, cz, rx, ry, rz) {
  const x = px - cx, y = py - cy, z = pz - cz;
  const k0 = Math.hypot(x / rx, y / ry, z / rz);
  const k1 = Math.hypot(x / (rx * rx), y / (ry * ry), z / (rz * rz));
  return k1 < 1e-9 ? -Math.min(rx, ry, rz) : k0 * (k0 - 1) / k1;
}
function sdRoundCone(px, py, pz, ax, ay, az, bx, by, bz, r1, r2) {
  const bax = bx - ax, bay = by - ay, baz = bz - az;
  const l2 = bax * bax + bay * bay + baz * baz;
  const rr = r1 - r2, a2 = l2 - rr * rr, il2 = 1 / l2;
  const pax = px - ax, pay = py - ay, paz = pz - az;
  const y = pax * bax + pay * bay + paz * baz;
  const z = y - l2;
  const qx = pax * l2 - bax * y, qy = pay * l2 - bay * y, qz = paz * l2 - baz * y;
  const x2 = qx * qx + qy * qy + qz * qz;
  const y2 = y * y * l2, z2 = z * z * l2;
  const k = Math.sign(rr) * rr * rr * x2;
  if (Math.sign(z) * a2 * z2 > k) return Math.sqrt(x2 + z2) * il2 - r2;
  if (Math.sign(y) * a2 * y2 < k) return Math.sqrt(x2 + y2) * il2 - r1;
  return (Math.sqrt(x2 * a2 * il2) + y * rr) * il2 - r1;
}
function sideSDF(x, y, z) {
  // rump lobe ("loaf" cheek)
  let d = sdEllipsoid(x, y, z, 0.46, 1.68, -0.06, 0.64, 0.80, 0.90);
  // thigh mass carrying the pants
  d = smin(d, sdEllipsoid(x, y, z, 0.60, 1.0, 0.12, 0.37, 0.60, 0.54), 0.30);
  // stifle bulge toward the flank
  d = smin(d, sdEllipsoid(x, y, z, 0.64, 1.08, -0.78, 0.32, 0.48, 0.50), 0.25);
  // hock + metatarsus
  d = smin(d, sdRoundCone(x, y, z, 0.62, 0.68, 0.48, 0.63, 0.20, 0.14, 0.235, 0.15), 0.16);
  // paw and toes
  d = smin(d, sdEllipsoid(x, y, z, 0.63, 0.15, -0.08, 0.205, 0.16, 0.36), 0.10);
  d = smin(d, sdEllipsoid(x, y, z, 0.63, 0.12, -0.38, 0.185, 0.11, 0.14), 0.06);
  return d;
}
function bodySDF(x, y, z) {
  let d = sdEllipsoid(x, y, z, 0, 1.64, -1.5, 0.92, 0.84, 1.95);
  const dr = sideSDF(x, y, z), dl = sideSDF(-x, y, z);
  d = smin(d, smin(dr, dl, 0.18), 0.30);
  d = smin(d, sdEllipsoid(x, y, z, 0, 1.78, -0.10, 0.46, 0.52, 0.66), 0.22);
  // docked tail stub
  d = smin(d, sdRoundCone(x, y, z, 0, 1.98, 0.45, 0, 2.22, 0.84, 0.17, 0.11), 0.14);
  // cleft between the cheeks
  d = smax(d, -sdEllipsoid(x, y, z, 0, 1.55, 1.08, 0.07, 0.62, 0.40), 0.12);
  // flat soles on the ground
  d = smax(d, -y, 0.03);
  return d;
}
function sdfGrad(x, y, z, out) {
  const e = 0.012;
  const gx = bodySDF(x + e, y, z) - bodySDF(x - e, y, z);
  const gy = bodySDF(x, y + e, z) - bodySDF(x, y - e, z);
  const gz = bodySDF(x, y, z + e) - bodySDF(x, y, z - e);
  const l = Math.hypot(gx, gy, gz) || 1;
  out[0] = gx / l; out[1] = gy / l; out[2] = gz / l;
}

/* ------------------------------------------------------------ surface nets */
function buildMesh(h) {
  const x0 = -1.6, y0 = -0.1, z0 = -5.4, x1 = 1.6, y1 = 3.0, z1 = 1.3;
  const nx = Math.round((x1 - x0) / h), ny = Math.round((y1 - y0) / h), nz = Math.round((z1 - z0) / h);
  const sx = nx + 1, sy = ny + 1, sz = nz + 1, sxy = sx * sy;
  const D = new Float32Array(sx * sy * sz);
  for (let k = 0; k < sz; k += 2) for (let j = 0; j < sy; j += 2) for (let i = 0; i < sx; i += 2) {
    const v = bodySDF(x0 + i * h, y0 + j * h, z0 + k * h);
    const far = Math.abs(v) > 0.55;
    for (let dk = 0; dk < 2 && k + dk < sz; dk++) for (let dj = 0; dj < 2 && j + dj < sy; dj++) for (let di = 0; di < 2 && i + di < sx; di++) {
      const id = (i + di) + sx * ((j + dj) + sy * (k + dk));
      D[id] = (far || (!di && !dj && !dk)) ? v : bodySDF(x0 + (i + di) * h, y0 + (j + dj) * h, z0 + (k + dk) * h);
    }
  }
  const cell = new Int32Array(nx * ny * nz).fill(-1);
  const V = [];
  const EDGES = [[0,1],[2,3],[4,5],[6,7],[0,2],[1,3],[4,6],[5,7],[0,4],[1,5],[2,6],[3,7]];
  const cv = new Float32Array(8);
  for (let k = 0; k < nz; k++) for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
    const b = i + sx * (j + sy * k);
    cv[0] = D[b]; cv[1] = D[b + 1]; cv[2] = D[b + sx]; cv[3] = D[b + sx + 1];
    cv[4] = D[b + sxy]; cv[5] = D[b + sxy + 1]; cv[6] = D[b + sxy + sx]; cv[7] = D[b + sxy + sx + 1];
    let mask = 0;
    for (let n = 0; n < 8; n++) if (cv[n] < 0) mask |= 1 << n;
    if (mask === 0 || mask === 255) continue;
    let ax = 0, ay = 0, az = 0, cnt = 0;
    for (let e = 0; e < 12; e++) {
      const a = EDGES[e][0], c = EDGES[e][1];
      const da = cv[a], dc = cv[c];
      if ((da < 0) === (dc < 0)) continue;
      const t = da / (da - dc);
      ax += (a & 1) + t * ((c & 1) - (a & 1));
      ay += ((a >> 1) & 1) + t * (((c >> 1) & 1) - ((a >> 1) & 1));
      az += ((a >> 2) & 1) + t * (((c >> 2) & 1) - ((a >> 2) & 1));
      cnt++;
    }
    cell[i + nx * (j + ny * k)] = V.length / 3;
    V.push(x0 + (i + ax / cnt) * h, y0 + (j + ay / cnt) * h, z0 + (k + az / cnt) * h);
  }
  const ci = (i, j, k) => cell[i + nx * (j + ny * k)];
  const T = [];
  const quad = (a, b, c, d) => { if (a < 0 || b < 0 || c < 0 || d < 0) return; T.push(a, b, c, a, c, d); };
  for (let k = 0; k < sz; k++) for (let j = 0; j < sy; j++) for (let i = 0; i < sx; i++) {
    const d0 = D[i + sx * (j + sy * k)];
    if (i < nx && j > 0 && k > 0 && j < ny && k < nz) {
      const d1 = D[(i + 1) + sx * (j + sy * k)];
      if ((d0 < 0) !== (d1 < 0)) {
        const q = [ci(i, j - 1, k - 1), ci(i, j, k - 1), ci(i, j, k), ci(i, j - 1, k)];
        d0 < 0 ? quad(q[0], q[1], q[2], q[3]) : quad(q[0], q[3], q[2], q[1]);
      }
    }
    if (j < ny && i > 0 && k > 0 && i < nx && k < nz) {
      const d1 = D[i + sx * ((j + 1) + sy * k)];
      if ((d0 < 0) !== (d1 < 0)) {
        const q = [ci(i - 1, j, k - 1), ci(i, j, k - 1), ci(i, j, k), ci(i - 1, j, k)];
        d0 < 0 ? quad(q[0], q[3], q[2], q[1]) : quad(q[0], q[1], q[2], q[3]);
      }
    }
    if (k < nz && i > 0 && j > 0 && i < nx && j < ny) {
      const d1 = D[i + sx * (j + sy * (k + 1))];
      if ((d0 < 0) !== (d1 < 0)) {
        const q = [ci(i - 1, j - 1, k), ci(i, j - 1, k), ci(i, j, k), ci(i - 1, j, k)];
        d0 < 0 ? quad(q[0], q[1], q[2], q[3]) : quad(q[0], q[3], q[2], q[1]);
      }
    }
  }
  // project onto the true surface, compute normals
  const nv = V.length / 3;
  const P = new Float32Array(V), N = new Float32Array(nv * 3), g = [0, 0, 0];
  for (let v = 0; v < nv; v++) {
    let x = P[v * 3], y = P[v * 3 + 1], z = P[v * 3 + 2];
    for (let it = 0; it < 2; it++) {
      const d = bodySDF(x, y, z);
      sdfGrad(x, y, z, g);
      const m = clamp(d, -0.6 * h, 0.6 * h);
      x -= g[0] * m; y -= g[1] * m; z -= g[2] * m;
    }
    sdfGrad(x, y, z, g);
    P[v * 3] = x; P[v * 3 + 1] = y; P[v * 3 + 2] = z;
    N[v * 3] = g[0]; N[v * 3 + 1] = g[1]; N[v * 3 + 2] = g[2];
  }
  // fix winding against the SDF normals
  const I = new Uint32Array(T);
  for (let t = 0; t < I.length; t += 3) {
    const a = I[t] * 3, b = I[t + 1] * 3, c = I[t + 2] * 3;
    const ux = P[b] - P[a], uy = P[b + 1] - P[a + 1], uz = P[b + 2] - P[a + 2];
    const wx = P[c] - P[a], wy = P[c + 1] - P[a + 1], wz = P[c + 2] - P[a + 2];
    const nx_ = uy * wz - uz * wy, ny_ = uz * wx - ux * wz, nz_ = ux * wy - uy * wx;
    if (nx_ * N[a] + ny_ * N[a + 1] + nz_ * N[a + 2] < 0) { const tmp = I[t + 1]; I[t + 1] = I[t + 2]; I[t + 2] = tmp; }
  }
  return { P, N, I, nv };
}

/* -------------------------------------------- per-vertex fur / coat / AO data */
const SPRING_REGIONS = [  // rest centres + sigma for the fur lag springs
  { c: [-0.46, 1.66, -0.12], s: 0.80 },  // 0 rump L
  { c: [ 0.46, 1.66, -0.12], s: 0.80 },  // 1 rump R
  { c: [-0.62, 1.0,  0.20], s: 0.60 },  // 2 pants L
  { c: [ 0.62, 1.0,  0.20], s: 0.60 },  // 3 pants R
  { c: [ 0.00, 2.10,  0.65], s: 0.36 },  // 4 tail tuft
  { c: [ 0.00, 2.30, -1.80], s: 1.30 }   // 5 back
];

function furData(x, y, z, nx, ny, nz) {
  const ax = Math.abs(x);
  const nse = vnoise(x * 2.3 + 11, y * 2.3, z * 2.3);
  const pants = Math.exp(-((ax - 0.62) ** 2 / 0.36 + (y - 1.12) ** 2 / 0.42 + (z - 0.18) ** 2 / 0.46));
  const legFactor = sstep(0.52, 0.80, y);
  let L = 0.15 + 0.18 * pants;
  L += 0.045 * Math.exp(-((ax - 0.45) ** 2 / 0.5 + (y - 1.95) ** 2 / 0.6 + z * z / 1.0));
  const belly = sstep(-0.15, -0.8, ny) * sstep(1.3, 0.8, y);
  L += 0.08 * belly;
  L = mix(0.055, L, legFactor);
  if (y < 0.30) L = Math.min(L, mix(0.035, L, sstep(0.05, 0.30, y)));
  const tail = sstep(2.0, 2.15, y) * sstep(0.45, 0.65, z) * sstep(0.45, 0.25, ax);
  L = mix(L, 0.15, tail);
  L *= 0.88 + 0.24 * nse;
  L *= mix(1.0, 0.12, sstep(-0.40, -0.85, ny) * sstep(0.45, 0.22, y));
  let droop = (0.10 + 0.50 * pants + 0.5 * belly) * legFactor;
  droop = Math.min(0.85, droop);
  const gl = Math.min(1, pants * 1.2 + (1 - legFactor));
  let fx = 0, fy = mix(-0.45, -1.0, gl), fz = mix(0.9, 0.15, gl);
  const dp = fx * nx + fy * ny + fz * nz;
  fx -= nx * dp; fy -= ny * dp; fz -= nz * dp;
  const fl = Math.hypot(fx, fy, fz) || 1;
  return { L, droop, fx: fx / fl, fy: fy / fl, fz: fz / fl, pants };
}

function coatData(x, y, z) {
  const ax = Math.abs(x);
  const nz_ = vnoise(x * 4.1 + 3, y * 4.1, z * 4.1) * 2 - 1;
  const nz2 = vnoise(x * 9.7, y * 9.7 + 5, z * 9.7) * 2 - 1;
  const flank = 1.0 + 0.62 * sstep(-2.7, 0.3, z);
  const cleft = 0.34 * Math.exp(-ax * ax / 0.07) * sstep(0.0, 0.6, z);
  const yb = flank + cleft + nz_ * 0.14 + nz2 * 0.05;
  let W = 1 - sstep(yb - 0.14, yb + 0.14, y);
  let K = 0, S = 0;
  if (COAT === 'tri' || COAT === 'bht') {
    const band = COAT === 'tri' ? 0.36 : 0.13;
    K = sstep(yb + band - 0.14, yb + band + 0.16, y + nz2 * 0.06);
    if (COAT === 'bht') K = Math.max(K, 0.9 * sstep(0.6, 0.35, ax) * 0 );
    K = Math.min(K, 1 - W);
  }
  if (COAT === 'sable') S = (0.70 + 0.30 * (nz_ * 0.5 + 0.5)) * sstep(0.85, 1.7, y) * (0.60 + 0.40 * sstep(-3.0, 0.0, z));
  return { W, K, S };
}

function buildAttributes(mesh) {
  const { P, N, nv } = mesh;
  const aFur = new Float32Array(nv), aDroop = new Float32Array(nv), aAO = new Float32Array(nv);
  const aFlow = new Float32Array(nv * 3), aCoat = new Float32Array(nv * 4), aW0 = new Float32Array(nv * 4), aW1 = new Float32Array(nv * 4);
  for (let v = 0; v < nv; v++) {
    const x = P[v * 3], y = P[v * 3 + 1], z = P[v * 3 + 2], nx = N[v * 3], ny = N[v * 3 + 1], nz = N[v * 3 + 2];
    const f = furData(x, y, z, nx, ny, nz);
    aFur[v] = f.L; aDroop[v] = f.droop;
    aFlow[v * 3] = f.fx; aFlow[v * 3 + 1] = f.fy; aFlow[v * 3 + 2] = f.fz;
    // SDF ambient occlusion
    let occ = 0, wgt = 1;
    for (let i = 1; i <= 5; i++) {
      const dist = 0.06 + 0.11 * i;
      const d = bodySDF(x + nx * dist, y + ny * dist, z + nz * dist);
      occ += (dist - d) * wgt; wgt *= 0.72;
    }
    aAO[v] = clamp(1 - 1.25 * occ, 0.30, 1);
    const c = coatData(x, y, z);
    aCoat[v * 4] = c.W; aCoat[v * 4 + 1] = c.K; aCoat[v * 4 + 2] = 1 - c.W - c.K; aCoat[v * 4 + 3] = c.S;
    // spring weights
    const w = [];
    let ws = 0;
    for (let r = 0; r < 6; r++) {
      const R = SPRING_REGIONS[r];
      const d2 = (x - R.c[0]) ** 2 + (y - R.c[1]) ** 2 + (z - R.c[2]) ** 2;
      const wv = Math.exp(-d2 / (R.s * R.s)); w.push(wv); ws += wv;
    }
    const norm = 1 / (ws + 0.12);
    aW0[v * 4] = w[0] * norm; aW0[v * 4 + 1] = w[1] * norm; aW0[v * 4 + 2] = w[2] * norm; aW0[v * 4 + 3] = w[3] * norm;
    aW1[v * 4] = w[4] * norm; aW1[v * 4 + 1] = w[5] * norm;
    // flesh jiggle weights
    const jl = Math.exp(-((x + 0.46) ** 2 + (y - 1.5) ** 2 + (z + 0.1) ** 2) / 0.9);
    const jr = Math.exp(-((x - 0.46) ** 2 + (y - 1.5) ** 2 + (z + 0.1) ** 2) / 0.9);
    aW1[v * 4 + 2] = jl; aW1[v * 4 + 3] = jr;
  }
  return { aFur, aDroop, aAO, aFlow, aCoat, aW0, aW1 };
}

/* =============================================================== shaders */
const GLSL_COMMON = /* glsl */`
uniform float uYaw, uRoll, uShift, uPitch, uHop, uFoot, uSquash, uBreath, uPawL, uPawR, uTail;
uniform vec3 uLag[6];
uniform vec3 uJig[2];
uniform mat3 uLegM[2];
const float SA = -3.6, SB = -0.8, Y0 = 1.25;
float sst(float a, float b, float x){ float u = clamp((x - a) / (b - a), 0.0, 1.0); return u * u * (3.0 - 2.0 * u); }
float spS(float z){ return sst(SA, SB, z); }
float spI(float z){
  float L = SB - SA; float u = (z - SA) / L;
  if (u <= 0.0) return 0.0;
  if (u >= 1.0) return L * 0.5 + (z - SB);
  return L * (u * u * u - 0.5 * u * u * u * u);
}
// Rigid-ish body deformation: spine bend (yaw/roll/pitch/shift/hop) + planted legs + paw lift + tail wag.
vec3 deformBody(vec3 p, out mat3 R){
  float wT = sst(2.0, 2.2, p.y) * sst(0.3, 0.5, p.z) * sst(0.5, 0.2, abs(p.x));
  vec2 tb = vec2(0.0, 0.42); vec2 dd = p.xz - tb; float ta = uTail * wT; float tc = cos(ta), ts = sin(ta);
  vec3 p0 = p;
  p.xz = tb + vec2(tc * dd.x + ts * dd.y, -ts * dd.x + tc * dd.y);
  float s = spS(p.z), S = spI(p.z);
  float br = uBreath * (1.0 - 0.5 * s);
  vec3 q0 = p; q0.x *= 1.0 + br; q0.y = Y0 + (q0.y - Y0) * (1.0 + br);
  float psi = uYaw * s, phi = uRoll * s, th = uPitch * s;

const FRAG_SHELL = /* glsl */`

${FRAG_LIGHT}

    sin(w.y * 1.7 + w.z * 1.3 + 1.0) + sin(w.z * 2.9 - w.x * 2.3 + 4.0),

const FRAG_GROUND = /* glsl */`
precision highp float;

uniform vec3 uL, uGroundCol;
uniform vec4 uSph[12];

float sphShadow(vec3 ro, vec3 rd, vec4 s, float k){

canvas.addEventListener('pointerdown', e => {
  ptr.down = true; ptr.id = e.pointerId; ptr.x = ptr.sx = e.clientX; ptr.y = ptr.sy = e.clientY; ptr.t = performance.now(); ptr.moved = false;
  cam.vaz = cam.vel = 0; ptr.lastT = performance.now();
  try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
  canvas.classList.add('drag');
});
canvas.addEventListener('pointermove', e => {
  if (!ptr.down) { canvas.classList.toggle('hit', hitDog(e.clientX, e.clientY)); return; }
  if (e.pointerId !== ptr.id) return;
  const dx = e.clientX - ptr.x, dy = e.clientY - ptr.y;
  ptr.x = e.clientX; ptr.y = e.clientY;
  if (Math.hypot(e.clientX - ptr.sx, e.clientY - ptr.sy) > 5) ptr.moved = true;
  if (!ptr.moved) return;
  const k = 0.0075;
  cam.az -= dx * k; cam.el = clamp(cam.el + dy * 0.006, -0.42, 1.28);
  const now = performance.now(), dtm = Math.max(8, now - ptr.lastT) / 1000; ptr.lastT = now;
  cam.vaz = mix(cam.vaz, -dx * k / dtm, 0.5); cam.vel = mix(cam.vel, dy * 0.006 / dtm, 0.5);
});
function endPtr(e) {
  if (!ptr.down || e.pointerId !== ptr.id) return;
  ptr.down = false; canvas.classList.remove('drag');
  try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
  if (!ptr.moved && performance.now() - ptr.t < 500 && e.type === 'pointerup') { if (hitDog(e.clientX, e.clientY)) triggerWiggle(); }
  if (performance.now() - ptr.lastT > 90) cam.vaz = cam.vel = 0;
}
canvas.addEventListener('pointerup', endPtr);
canvas.addEventListener('pointercancel', endPtr);
canvas.addEventListener('contextmenu', e => e.preventDefault());

/* ================================================================ resize */
let pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
function resize() {
  const w = Math.max(1, canvas.clientWidth), h = Math.max(1, canvas.clientHeight);
  renderer.setPixelRatio(pixelRatio);
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  const v = new THREE.Vector2(); renderer.getDrawingBufferSize(v); U.uRes.value.copy(v);
}
resize();
new ResizeObserver(resize).observe(canvas);
window.addEventListener('resize', resize);

/* ===================================================== adaptive quality */
const Q = { layers: 48, acc: 0, n: 0, cool: 0, tier: 0 };
function adapt(dt) {
  if (dt > 0.25) return;
  Q.acc += dt; Q.n++;
  if (Q.n < 40) return;
  const avg = Q.acc / Q.n; Q.acc = 0; Q.n = 0;
  if (Q.cool > 0) { Q.cool--; return; }
  if (avg > 0.021) {
    if (Q.layers > 26) Q.layers = Math.max(24, Math.round(Q.layers * 0.78));
    else if (pixelRatio > 1.25) { pixelRatio = Math.max(1, pixelRatio * 0.8); resize(); }
    else if (Q.layers > 18) Q.layers = 18;
    shellGeo.instanceCount = Q.layers; U.uLayers.value = Q.layers; Q.cool = 3;
  }
}

/* ================================================================== loop */
function frame(dt) {
  dt = Math.min(dt, 1 / 20);
  simulate(dt);
  if (!ptr.down && (Math.abs(cam.vaz) > 0.01 || Math.abs(cam.vel) > 0.01)) {
    cam.az += cam.vaz * dt; cam.el = clamp(cam.el + cam.vel * dt, -0.42, 1.28);
    const dmp = Math.exp(-dt * 4.0); cam.vaz *= dmp; cam.vel *= dmp;
  }
  updateCamera(dt, false);
  renderer.render(scene, camera);
}
let last = performance.now();
function loop(now) {
  const dt = (now - last) / 1000; last = now;
  frame(dt); adapt(dt);
  requestAnimationFrame(loop);
}
updateCamera(0, true);
simulate(1 / 60);
if (DEBUG) {
  window.__corgi = {
    THREE, S, P_, U, cam, camera, renderer, scene, buildMs, nv: mesh.nv, tris: mesh.I.length / 3, COAT, HAS_MSAA,
    frame: (dt) => { frame(dt); },
    advance: (sec, step = 1 / 60) => { for (let t = 0; t < sec; t += step) simulate(step); },
    render: () => { updateCamera(0, true); renderer.render(scene, camera); },
    trigger: (type) => triggerWiggle(type),
    setCam: (az, el) => { cam.az = az; cam.el = el; updateCamera(0, true); },
    layers: (n) => { shellGeo.instanceCount = n; U.uLayers.value = n; },
    hit: hitDog, mesh, attrs, deformJS, proxyWorld, furSprings, ptr,
    shells: (b) => { shellMesh.visible = b; },
    dbgBase: (v) => { baseMat.uniforms.uDbg.value = v; }
  };
  if (!/manual/.test(location.hash)) requestAnimationFrame(t => { last = t; requestAnimationFrame(loop); });
} else {
  requestAnimationFrame(t => { last = t; requestAnimationFrame(loop); });
}
</script>
</body>
