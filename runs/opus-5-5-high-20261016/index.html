    N[v * 3] = gx / gl; N[v * 3 + 1] = gy / gl; N[v * 3 + 2] = gz / gl;
  }
  // orient triangles outward
  const I = new Uint32Array(idx);
  for (let t = 0; t < I.length; t += 3) {
    const a = I[t], b2 = I[t + 1], c = I[t + 2];
    const ux = P[b2 * 3] - P[a * 3], uy = P[b2 * 3 + 1] - P[a * 3 + 1], uz = P[b2 * 3 + 2] - P[a * 3 + 2];
    const wx = P[c * 3] - P[a * 3], wy = P[c * 3 + 1] - P[a * 3 + 1], wz = P[c * 3 + 2] - P[a * 3 + 2];
    const fx = uy * wz - uz * wy, fy = uz * wx - ux * wz, fz = ux * wy - uy * wx;
    const ndot = fx * (N[a * 3] + N[b2 * 3] + N[c * 3]) + fy * (N[a * 3 + 1] + N[b2 * 3 + 1] + N[c * 3 + 1]) + fz * (N[a * 3 + 2] + N[b2 * 3 + 2] + N[c * 3 + 2]);
    if (ndot < 0) { I[t + 1] = c; I[t + 2] = b2; }
  }
  return { P, N, I, nv };
}

/* ============================================================
   Per-vertex attributes: skin weights, coat masks, fur length, comb, baked occlusion
   ============================================================ */
const KEY_DIR = new THREE.Vector3(-0.50, 1.0, 0.62).normalize();

function torsoWeights(z, acc, s) {
  const knots = [[-0.40, B.root], [-0.28, B.chest], [-0.12, B.loin], [0.035, B.pelvis]];
  if (z <= knots[0][0]) { acc[B.root] += s; return; }
  if (z >= knots[3][0]) { acc[B.pelvis] += s; return; }
  for (let i = 0; i < 3; i++) {
    const [za, ba] = knots[i], [zb, bb] = knots[i + 1];
    if (z <= zb) { let t = (z - za) / (zb - za); t = t * t * (3 - 2 * t); acc[ba] += s * (1 - t); acc[bb] += s * t; return; }
  }
}

function buildAttributes(S) {
  const { P, N, nv } = S;
  const skinI = new Uint16Array(nv * 4), skinW = new Float32Array(nv * 4);
  const coatA = new Float32Array(nv * 4), comb = new Float32Array(nv * 3), fur = new Float32Array(nv), occ = new Float32Array(nv * 2);
  const D = new Float64Array(NP), acc = new Float64Array(NB);
  const tau = 0.0095;
  const tailBase = [0, 0.232, 0.118];
  for (let v = 0; v < nv; v++) {
    const x = P[v * 3], y = P[v * 3 + 1], z = P[v * 3 + 2];
    const nx = N[v * 3], ny = N[v * 3 + 1], nz = N[v * 3 + 2];
    const ax = Math.abs(x);
    evalPrims(x, y, z, D);
    // ---- skin weights
    acc.fill(0);
    for (let p = 0; p < NP; p++) {
      const s = Math.exp(-Math.max(D[p], 0) / tau);
      if (s < 1e-5) continue;
      const bones = PR[p].bones;
      if (bones === 'torso') {
        const under = sstep(-0.25, -0.75, ny) * sstep(-0.26, -0.18, z) * sstep(0.04, -0.03, z);
        torsoWeights(z, acc, s * (1 - 0.45 * under));
        acc[B.belly] += s * 0.45 * under;
      } else if (bones === 'pantsL' || bones === 'pantsR') {
        const L = bones === 'pantsL';
        const j = 0.25 + 0.55 * sstep(0.17, 0.08, y);
        acc[L ? B.pantsL : B.pantsR] += s * j;
        acc[L ? B.thighL : B.thighR] += s * (1 - j);
      } else for (const [b, f] of bones) acc[b] += s * f;
    }
    const order = Array.from(acc.keys()).sort((a, b) => acc[b] - acc[a]).slice(0, 4);
    let sum = 0; for (const b of order) sum += acc[b];
    for (let k = 0; k < 4; k++) { skinI[v * 4 + k] = order[k]; skinW[v * 4 + k] = sum > 0 ? acc[order[k]] / sum : (k === 0 ? 1 : 0); }

    // ---- coat masks
    const n1 = fbm(x * 22 + 3.1, y * 22 + 1.7, z * 22 + 8.3);
    const n2 = fbm(x * 55 + 11.0, y * 55 + 4.0, z * 55 + 2.0);
    // white: stockings, pants (heart-shaped upper border), belly, inner thighs
    const legW = sstep(V.legH + 0.014, V.legH - 0.014, y + V.wNoise * n1 + 0.012 * Math.max(0, -nz));
    const pTop = V.pantsH - V.pantsCurve * x * x + 0.012 * sstep(0.03, 0.0, ax);
    const pantsW = sstep(pTop + 0.012, pTop - 0.012, y + V.wNoise * n1) * sstep(-0.05, 0.45, nz - 0.5 * Math.abs(nx)) * sstep(0.0, 0.05, z);
    const bellyW = sstep(-0.45, -0.8, ny) * sstep(0.16, 0.13, y + 0.012 * n2) * sstep(-0.36, -0.2, z);
    const innerW = sstep(0.05, 0.026, ax) * sstep(0.17, 0.125, y + 0.01 * n1) * sstep(-0.06, 0.0, z);
    const stifleW = sstep(-0.2, -0.6, nz) * sstep(0.12, 0.095, y + 0.01 * n1); // white creeping up the front of the hind leg
    let white = Math.max(legW, pantsW, bellyW, innerW, stifleW * (0.6 + 0.4 * V.blaze));
    // under-tail cream for reds
    if (coatName === 'red' || coatName === 'sable') {
      const ut = Math.exp(-((x * x) / (0.03 * 0.03) + ((y - 0.205) ** 2) / (0.03 * 0.03) + ((z - 0.13) ** 2) / (0.05 * 0.05)));
      white = Math.max(white, 0.35 * ut * sstep(0, 0.5, nz));
    }
    white = clamp(white, 0, 1);
    // saddle (black for tri/bht, dark tipping for sable/red)
    let sY = coat.sY + V.sShift;
    if (coatName === 'tri') sY += 0.032 * sstep(0.02, 0.12, z);
    if (coatName === 'bht') sY += 0.055 * sstep(0.05, 0.13, z) + 0.03 * sstep(0.08, 0.15, z) * sstep(0.05, -0.02, ny);
    if (coatName === 'sable' || coatName === 'red') sY += 0.02 * sstep(0.05, 0.13, z);
    if (coatName === 'tri' || coatName === 'bht') sY -= 1.4 * x * x - 0.012 * n2;
    let saddle = sstep(sY - coat.sSoft, sY + coat.sSoft, y + 0.028 * n1 + 0.01 * ny);
    if (coatName === 'tri' || coatName === 'bht') {
      const tp = Math.exp(-((x * x) / (0.035 * 0.035) + ((y - 0.215) ** 2) / (0.03 * 0.03) + ((z - 0.13) ** 2) / (0.045 * 0.045)));
      saddle *= 1 - 0.95 * tp * sstep(0, 0.4, nz);
    }
    saddle *= 1 - white;
    const shade = clamp(0.5 + 0.5 * ny + 0.25 * n1, 0, 1);
    coatA.set([white, saddle, shade, 0.5 + 0.5 * n2], v * 4);

    // ---- fur length (m)
    let L = 0.0125;
    const rumpR = sstep(-0.02, 0.06, z) * sstep(0.15, 0.2, y);
    L += 0.004 * rumpR;
    const pantsR = sstep(-0.5, 0.15, nz) * sstep(0.185, 0.15, y) * sstep(0.055, 0.085, y) * sstep(0.0, 0.05, z);
    L = L + (0.034 * V.pantsFluff - L) * pantsR;
    const bellyR = sstep(-0.3, -0.75, ny) * sstep(-0.35, -0.2, z) * sstep(0.17, 0.13, y);
    L = Math.max(L, 0.0165 * bellyR);
    const legR = sstep(0.095, 0.06, y) * (1 - 0.6 * pantsR);
    L = L + (0.0085 - L) * legR;
    const hockF = sstep(0.07, 0.04, y) * sstep(0.074, 0.088, z) * sstep(0.03, 0.1, z);
    L = Math.max(L, 0.009 * hockF * sstep(0.03, 0.05, y));
    const pawR = sstep(0.034, 0.02, y);
    L = L + (0.0042 - L) * pawR;
    const tailR = Math.exp(-((x * x) + (y - 0.246) ** 2 + (z - 0.134) ** 2) / (0.028 * 0.028));
    L = Math.max(L, 0.026 * tailR);
    L *= V.furScale * (0.92 + 0.16 * (0.5 + 0.5 * n2));
    L *= 0.08 + 0.92 * sstep(0.002, 0.016, y); // no fur skirt where the paw meets the floor
    fur[v] = L;

    // ---- comb (strand lean) direction, tangent
    let cx = 0, cy = -0.3, cz = 1;
    const down = Math.max(pantsR, legR, sstep(0.16, 0.11, y));
    cx = cx * (1 - down); cy = cy * (1 - down) - down; cz = cz * (1 - down) + 0.35 * down;
    // radiate from tail base on the rump (the "heart" whorl)
    const tdx = x - tailBase[0], tdy = y - tailBase[1] - 0.02, tdz = z - tailBase[2];
    const tl = Math.hypot(tdx, tdy, tdz) + 1e-6;
    const whorl = sstep(0.10, 0.03, tl) * sstep(-0.1, 0.4, nz);
    cx = cx * (1 - whorl) + whorl * tdx / tl; cy = cy * (1 - whorl) + whorl * (tdy / tl - 0.4); cz = cz * (1 - whorl) + whorl * tdz / tl;
    // sides: flow slightly outward and down
    cx += 0.25 * Math.sign(x) * sstep(0.02, 0.08, ax) * (1 - down);
    const dn = cx * nx + cy * ny + cz * nz;
    cx -= nx * dn; cy -= ny * dn; cz -= nz * dn;
    const cl = Math.hypot(cx, cy, cz) || 1;
    comb.set([cx / cl, cy / cl, cz / cl], v * 3);

    // ---- baked ambient occlusion & key-light soft shadow (rest pose)
    let ao = 0, wsum = 0;
    for (let k = 1; k <= 5; k++) {
      const d = 0.012 * k;
      const s = sdf(x + nx * d, y + ny * d, z + nz * d);
      ao += (d - Math.max(s, 0)) / d * (1 / k); wsum += 1 / k;
    }
    ao = clamp(1 - 0.95 * ao / wsum, 0, 1);
    // ground occlusion (low surfaces are darker)
    ao *= 0.72 + 0.28 * sstep(0.0, 0.1, y + 0.04 * ny);
    let sh = 1, t = 0.006;
    const ox = x + nx * 0.004, oy = y + ny * 0.004, oz = z + nz * 0.004;
    for (let k = 0; k < 22 && t < 0.35; k++) {
      const d = sdf(ox + KEY_DIR.x * t, oy + KEY_DIR.y * t, oz + KEY_DIR.z * t);
      sh = Math.min(sh, 7 * d / t);
      if (sh < 0.02) { sh = 0; break; }
      t += clamp(d, 0.004, 0.04);
    }
    occ[v * 2] = ao; occ[v * 2 + 1] = clamp(sh, 0, 1);
  }
  return { skinI, skinW, coatA, comb, fur, occ };
}

/* ============================================================
   Procedural strand / clump textures
   ============================================================ */
function makeStrandTexture(size, cells, rng, mode) {
  const data = new Uint8Array(size * size * 4);
  const px = new Float32Array(cells * cells), py = new Float32Array(cells * cells), a = new Float32Array(cells * cells), b = new Float32Array(cells * cells), c = new Float32Array(cells * cells);
  for (let i = 0; i < cells * cells; i++) {
    px[i] = rng.range(0.12, 0.88); py[i] = rng.range(0.12, 0.88);
    const r = rng.next();
    a[i] = mode === 0 ? (r < 0.35 ? 0.35 + 0.35 * rng.next() : 0.72 + 0.28 * rng.next()) : rng.range(0.7, 1.0);
    b[i] = rng.next(); c[i] = rng.next();
  }
  const cs = size / cells;
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const fx = (x + 0.5) / cs, fy = (y + 0.5) / cs;
    const ci = Math.floor(fx), cj = Math.floor(fy);
    let best = 1e9, bi = 0, bdx = 0, bdy = 0;
    for (let dj = -1; dj <= 1; dj++) for (let di = -1; di <= 1; di++) {
      const ii = (ci + di + cells) % cells, jj = (cj + dj + cells) % cells;
      const k = ii + jj * cells;
      const dx = ci + di + px[k] - fx, dy = cj + dj + py[k] - fy;
      const d = dx * dx + dy * dy;
      if (d < best) { best = d; bi = k; bdx = dx; bdy = dy; }
    }
    const o = (x + y * size) * 4;
    if (mode === 0) {
      data[o] = Math.min(255, Math.sqrt(best) / 0.75 * 255);
      data[o + 1] = a[bi] * 255; data[o + 2] = b[bi] * 255; data[o + 3] = c[bi] * 255;
    } else {
      data[o] = clamp(bdx / 1.5 + 0.5, 0, 1) * 255; data[o + 1] = clamp(bdy / 1.5 + 0.5, 0, 1) * 255;
      data[o + 2] = b[bi] * 255; data[o + 3] = a[bi] * 255;
    }
  }
  const tex = new THREE.DataTexture(data, size, size, THREE.RGBAFormat, THREE.UnsignedByteType);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.magFilter = THREE.LinearFilter;
  tex.minFilter = THREE.LinearMipmapLinearFilter;
  tex.generateMipmaps = true;
  tex.colorSpace = THREE.NoColorSpace;
  tex.needsUpdate = true;
  return tex;
}

   ============================================================ */
const AO_SPH = [
  [B.pelvis, [0, 0.17, 0.05], 0.10], [B.loin, [0, 0.17, -0.12], 0.085], [B.chest, [0, 0.165, -0.26], 0.075],
  ...legs.flatMap(lg => [[lg.bT, [lg.H0.x, 0.13, 0.04], 0.05], [lg.bP, [lg.P0.x, 0.013, 0.04], 0.028]]),
].map(([b, c, r]) => ({ b, c: new THREE.Vector3(...c).sub(REST[b]), r }));
function updateAO() {
  AO_SPH.forEach((s, i) => {
    _pc.copy(s.c).applyMatrix4(W[s.b]);
    sphU.value[i].set(_pc.x, _pc.y, _pc.z, s.r);
  });
}

/* ============================================================
   Resize, quality, loop
   ============================================================ */
function resize() {
  const w = Math.max(1, window.innerWidth), h = Math.max(1, window.innerHeight);
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  // keep the dog framed in non-square containers
  camera.fov = w >= h ? 30 : 2 * Math.atan(Math.tan(15 * DEG) * h / w) / DEG;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
if (window.ResizeObserver) new ResizeObserver(resize).observe(document.body);
resize();

const clock = { t: 0, last: performance.now() };
const perf = { acc: 0, n: 0, slow: 0, level: 0, warm: 0 };
function adaptQuality(dtReal) {
  if (dtReal > 0.2) return; // hidden tab / stall: ignore
  perf.warm += dtReal;
  if (perf.warm < 3) return;
  perf.acc += dtReal; perf.n++;
  if (perf.acc < 2) return;
  const avg = perf.acc / perf.n;
  perf.acc = 0; perf.n = 0;
  if (avg > 1 / 40) perf.slow++; else perf.slow = 0;
  if (perf.slow >= 2 && perf.level < 3) {
    perf.level++; perf.slow = 0;
    if (perf.level === 1) setShells(28);
    else if (perf.level === 2) { renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5)); resize(); }
    else { setShells(20); renderer.setPixelRatio(1); resize(); }
  }
}

const _kv = new THREE.Vector3();
function frame(now) {
  requestAnimationFrame(frame);
  const dtReal = Math.max(0, (now - clock.last) / 1000);
  clock.last = now;
  const dt = Math.min(dtReal, 1 / 20);
  clock.t += dt;
  adaptQuality(dtReal);
  if (!drag && (cam.vaz || cam.vel)) {
    cam.az += cam.vaz * dt; cam.el = clamp(cam.el + cam.vel * dt, EL_MIN, EL_MAX);
    const dmp = Math.exp(-dt * 5);
    cam.vaz *= dmp; cam.vel *= dmp;
    if (Math.abs(cam.vaz) < 1e-3 && Math.abs(cam.vel) < 1e-3) cam.vaz = cam.vel = 0;
  }
  if (dt > 0) { updateBehaviour(clock.t, dt); solveRig(dt); }
  updateAO();
  placeCamera();
  camera.updateMatrixWorld();
  setDrawMode(camera.position.z < Z_SPLIT);
  camera.getWorldDirection(_kv);
  COMMON_U.uCapVis.value = sstep(0.3, 0.85, _kv.z);
  _kv.copy(KEY_DIR).transformDirection(camera.matrixWorldInverse);
  keyDirViewU.value.copy(_kv);
  renderer.render(scene, camera);
}
updateBehaviour(0, 1 / 60); solveRig(1 / 60);
requestAnimationFrame((t) => { clock.last = t; frame(t); });

// small hook for embedding pages / automated checks
window.corgi.wiggle = () => triggerWiggle(clock.t);
window.corgi.view = (azDeg, elDeg) => { cam.az = azDeg * DEG; cam.el = clamp(elDeg * DEG, EL_MIN, EL_MAX); cam.vaz = cam.vel = 0; };
window.corgi.quality = () => ({ shells: SHELLS, dpr: renderer.getPixelRatio(), level: perf.level });
</script>
</body>
