  const W = new Float32Array(nv * NB);
  const segD = (px, py, pz, a, b) => {
    const bax = b[0] - a[0], bay = b[1] - a[1], baz = b[2] - a[2], pax = px - a[0], pay = py - a[1], paz = pz - a[2];
    const t = clamp((pax * bax + pay * bay + paz * baz) / (bax * bax + bay * bay + baz * baz), 0, 1);
    return Math.hypot(pax - bax * t, pay - bay * t, paz - baz * t);
  };
  const PEL0 = [0, 0.186, -0.12], PEL1 = [0, 0.19, 0.03], SPN0 = [0, 0.188, -0.42];
  for (let v = 0; v < nv; v++) {
    const x = pos[v * 3], y = pos[v * 3 + 1], z = pos[v * 3 + 2];
    const s = x >= 0 ? 1 : -1, ax = Math.abs(x);
    const hip = [LEG.hip[0], LEG.hip[1], LEG.hip[2]], stf = LEG.stf, hock = LEG.hock, toe = LEG.toe;
    const wf = d => 1 / Math.pow(Math.max(d, 0.003), 4);
    const dBody = Math.min(segD(x, y, z, PEL0, PEL1), segD(x, y, z, SPN0, PEL0)) - 0.072;
    const dTh = segD(ax, y, z, hip, stf) - 0.034;
    const dSh = segD(ax, y, z, stf, hock) - 0.019;
    const dFt = segD(ax, y, z, hock, toe) - 0.014;
    const dTl = segD(x, y, z, TAIL0, TAIL1) - 0.014;
    const body = wf(dBody), th = wf(dTh), sh = wf(dSh), ft = wf(dFt), tl = wf(dTl) * sstep(0.2, 0.225, y) * sstep(0.015, 0.035, z);
    const fr = sstep(-0.06, -0.27, z);
    const o9 = v * NB;
    W[o9 + 0] = body * (1 - fr); W[o9 + 1] = body * fr;
    W[o9 + (s > 0 ? 2 : 5)] = th; W[o9 + (s > 0 ? 3 : 6)] = sh; W[o9 + (s > 0 ? 4 : 7)] = ft;
    W[o9 + 8] = tl;
    let sum = 0; for (let b = 0; b < NB; b++) sum += W[o9 + b];
    for (let b = 0; b < NB; b++) W[o9 + b] /= sum;
  }
  const W2 = new Float32Array(nv * NB);
  for (let it = 0; it < 4; it++) {
    for (let v = 0; v < nv; v++) {
      const L = nb[v], o9 = v * NB;
      for (let b = 0; b < NB; b++) {
        let acc = 0; for (let q = 0; q < L.length; q++) acc += W[L[q] * NB + b];
        W2[o9 + b] = L.length ? 0.5 * W[o9 + b] + 0.5 * acc / L.length : W[o9 + b];
      }
    }
    W.set(W2);
  }
  const skinI = new Float32Array(nv * 4), skinW = new Float32Array(nv * 4);
  for (let v = 0; v < nv; v++) {
    const o9 = v * NB, y = pos[v * 3 + 1], s = pos[v * 3] >= 0 ? 1 : -1;
    // paws are pinned to the foot bone
    const pin = sstep(0.034, 0.024, y);
    if (pin > 0) {
      const fb = s > 0 ? 4 : 7;
      for (let b = 0; b < NB; b++) W[o9 + b] *= 1 - pin;
      W[o9 + fb] += pin;
    }
    const order = [...Array(NB).keys()].sort((a, b) => W[o9 + b] - W[o9 + a]).slice(0, 4);
    let sum = 0; for (const b of order) sum += W[o9 + b];
    for (let q = 0; q < 4; q++) { skinI[v * 4 + q] = order[q]; skinW[v * 4 + q] = W[o9 + order[q]] / sum; }
  }

  // --- fur, coat, flow and shading attributes ---
  const aFlow = new Float32Array(nv * 4), aFur = new Float32Array(nv * 4), aCoat = new Float32Array(nv * 4);
  const aLight = new Float32Array(nv * 4), aJig = new Float32Array(nv * 4);
  const KEY = new THREE.Vector3(0.45, 0.85, 0.6).normalize();
  const fluff = 0.93 + 0.14 * cv.fluff;
  sdfWithTail = false;
  for (let v = 0; v < nv; v++) {
    const x = pos[v * 3], y = pos[v * 3 + 1], z = pos[v * 3 + 2];
    const nx = nor[v * 3], ny = nor[v * 3 + 1], nz = nor[v * 3 + 2];
    const ax = Math.abs(x), s = x >= 0 ? 1 : -1;
    const pantsW = Math.max(gauss(x, y, z, 0.05, 0.12, 0.045, 0.06, 0.055, 0.045), gauss(x, y, z, -0.05, 0.12, 0.045, 0.06, 0.055, 0.045)) * sstep(-0.35, 0.3, nz);
    const legW = sstep(0.098, 0.062, y) * sstep(0.025, 0.045, ax);
    const pawW = sstep(0.04, 0.026, y);
    const bellyW = sstep(-0.2, -0.7, ny) * sstep(0.17, 0.125, y) * sstep(0.0, -0.06, z);
    const tailW = gauss(x, y, z, 0, 0.235, 0.05, 0.028, 0.03, 0.032);
    const rumpW = gauss(x, y, z, 0, 0.2, 0.03, 0.12, 0.08, 0.06);
    const thighW = sstep(0.4, 0.85, Math.abs(nx)) * sstep(0.06, 0.1, y) * sstep(0.22, 0.17, y) * sstep(-0.12, -0.06, z);
    const pad = sstep(0.0055, 0.0022, y) * sstep(-0.3, -0.8, ny);
    // fur length
    let L = 0.021;
    L = lerp(L, 0.028, rumpW);
    L = lerp(L, 0.02, thighW);
    L = lerp(L, 0.046, pantsW);
    L = lerp(L, 0.03, bellyW);
    L = lerp(L, 0.036, tailW);
    L = lerp(L, 0.011, legW);
    L = lerp(L, 0.0055, pawW);
    L *= fluff * (0.86 + 0.28 * (0.5 + 0.5 * noiseC(x * 40, y * 40, z * 40)));
    L *= 1 - pad;
    // preferred hair direction before projection to the tangent plane
    let dx = 0, dy = -0.3, dz = 1;                              // along the back towards the tail
    const side = sstep(0.22, 0.12, y);
    dx = lerp(dx, 0, side); dy = lerp(dy, -1, side); dz = lerp(dz, 0.35, side);  // flanks: down & back
    const rumpF = sstep(-0.03, 0.03, z) * (1 - side * 0.4);           // rump: falls down and out over the britches
    dx = lerp(dx, s * Math.min(ax * 6, 0.45), rumpF); dy = lerp(dy, -1, rumpF); dz = lerp(dz, 0.35, rumpF);
    dx = lerp(dx, s * 0.22, pantsW); dy = lerp(dy, -1, pantsW); dz = lerp(dz, 0.18, pantsW);
    dx = lerp(dx, 0, legW); dy = lerp(dy, -1, legW); dz = lerp(dz, 0.12, legW);
    dx = lerp(dx, 0, pawW); dy = lerp(dy, -0.45, pawW); dz = lerp(dz, -1, pawW);
    dx = lerp(dx, 0, bellyW); dy = lerp(dy, -1, bellyW); dz = lerp(dz, 0.25, bellyW);
    dx = lerp(dx, 0, tailW); dy = lerp(dy, -0.25, tailW); dz = lerp(dz, 1, tailW);
    const dn = dx * nx + dy * ny + dz * nz;
    let tx = dx - nx * dn, ty = dy - ny * dn, tz = dz - nz * dn;
    let tl = Math.hypot(tx, ty, tz);
    if (tl < 1e-4) { tx = 0; ty = -nz; tz = ny; tl = Math.hypot(tx, ty, tz) || 1; }
    let lift = 0.42;
    lift = lerp(lift, 0.5, rumpW);
    lift = lerp(lift, 0.56, pantsW);
    lift = lerp(lift, 0.3, legW);
    lift = lerp(lift, 0.24, pawW);
    lift = lerp(lift, 0.36, bellyW);
    lift = lerp(lift, 0.6, tailW);
    aFlow.set([tx / tl, ty / tl, tz / tl, lift], v * 4);
    const breathW = sstep(-0.05, -0.16, z) * sstep(0.08, 0.13, y);
    aFur.set([L, pad, breathW, 0.5 * (1 - legW) * (1 - pawW)], v * 4);
    aCoat.set(coatMasks(x, y, z, nx, ny, nz), v * 4);
    aJig.set([
      gauss(x, y, z, 0, 0.245, 0.02, 0.075, 0.055, 0.06),
      gauss(x, y, z, 0.05, 0.115, 0.045, 0.055, 0.05, 0.045) * (1 - pawW),
      gauss(x, y, z, -0.05, 0.115, 0.045, 0.055, 0.05, 0.045) * (1 - pawW),
      gauss(x, y, z, 0, 0.1, -0.13, 0.085, 0.045, 0.1),
    ], v * 4);
    // baked ambient occlusion
    let occ = 0, sca = 1;
    for (let i = 1; i <= 5; i++) {
      const hr = 0.008 * i;
      occ += (hr - sdf(x + nx * hr, y + ny * hr, z + nz * hr)) * sca;
      sca *= 0.8;
    }
    let ao = clamp(1 - 4.5 * occ, 0, 1);
    ao *= 1 - 0.55 * Math.exp(-Math.max(y, 0) / 0.03) * (0.5 + 0.5 * Math.max(0, -ny));
    ao *= 1 - 0.25 * Math.max(0, -ny) * Math.exp(-y / 0.12);
    // baked soft shadow from the key light
    let res = 1, t = 0.008;
    const ox = x + nx * 0.004, oy = y + ny * 0.004, oz = z + nz * 0.004;
    for (let i = 0; i < 40 && t < 0.45; i++) {
      const hh = sdf(ox + KEY.x * t, oy + KEY.y * t, oz + KEY.z * t);
      res = Math.min(res, 9 * hh / t);
      if (res < 0.002) break;
      t += clamp(hh, 0.004, 0.03);
    }
    const shadow = lerp(sstep(0, 1, clamp(res, 0, 1)), 1, 0.5 * tailW);
    // natural tone variation: richer along the topline, paler low on the flanks, soft patches
    const tone = lerp(1.07, 0.9, sstep(0.13, 0.27, y)) * (1 + 0.07 * noiseC(x * 14 + 3, y * 14, z * 14));
    aLight.set([lerp(clamp(ao, 0, 1), 1, 0.5 * tailW), shadow, tone * (1 + 0.1 * tailW), 0], v * 4);
  }
  sdfWithTail = true;
  return { pos, nor, index, skinI, skinW, aFlow, aFur, aCoat, aLight, aJig, nv };
}

/* =====================================================================
   Procedural strand volume: Worley strands + clump field (RGBA8 3D texture)
   R: distance to strand centre, G/B: per-strand randoms, A: distance to clump centre
   ===================================================================== */
function buildStrandTexture(rng) {
  const N = 64, C = 16, S = N / C, CC = 4, CS = N / CC;
  const fp = new Float32Array(C * C * C * 5);
  for (let i = 0; i < C * C * C * 5; i++) fp[i] = rng();
  const cp = new Float32Array(CC * CC * CC * 3);
  for (let i = 0; i < cp.length; i++) cp[i] = 0.2 + 0.6 * rng();
  const data = new Uint8Array(N * N * N * 4);
  let o = 0;
  for (let z = 0; z < N; z++) for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const px = (x + 0.5) / S, py = (y + 0.5) / S, pz = (z + 0.5) / S;
    const ix = Math.floor(px), iy = Math.floor(py), iz = Math.floor(pz);
    let best = 1e9, bi = 0;
    for (let dz = -1; dz <= 1; dz++) for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      const cx = ix + dx, cy = iy + dy, cz = iz + dz;
      const id = (((cx + C) % C) + C * (((cy + C) % C) + C * ((cz + C) % C))) * 5;
      const qx = cx + fp[id] - px, qy = cy + fp[id + 1] - py, qz = cz + fp[id + 2] - pz;
      const dd = qx * qx + qy * qy + qz * qz;
      if (dd < best) { best = dd; bi = id; }
    }
    const qx = (x + 0.5) / CS, qy = (y + 0.5) / CS, qz = (z + 0.5) / CS;
    const jx = Math.floor(qx), jy = Math.floor(qy), jz = Math.floor(qz);
    let bc = 1e9;
    for (let dz = -1; dz <= 1; dz++) for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      const cx = jx + dx, cy = jy + dy, cz = jz + dz;
      const id = (((cx + CC) % CC) + CC * (((cy + CC) % CC) + CC * ((cz + CC) % CC))) * 3;
      const rx = cx + cp[id] - qx, ry = cy + cp[id + 1] - qy, rz = cz + cp[id + 2] - qz;
      const dd = rx * rx + ry * ry + rz * rz;
      if (dd < bc) bc = dd;
    }
    data[o] = Math.min(255, Math.sqrt(best) * 255);
    data[o + 1] = fp[bi + 3] * 255;
    data[o + 2] = fp[bi + 4] * 255;
    data[o + 3] = Math.min(255, Math.sqrt(bc) / 0.9 * 255);
    o += 4;
  }
  const tex = new THREE.Data3DTexture(data, N, N, N);
  tex.format = THREE.RGBAFormat;
  tex.type = THREE.UnsignedByteType;
  tex.minFilter = THREE.LinearFilter;
  tex.magFilter = THREE.LinearFilter;
  tex.wrapS = tex.wrapT = tex.wrapR = THREE.RepeatWrapping;
  tex.unpackAlignment = 1;
  tex.generateMipmaps = false;
  tex.needsUpdate = true;
  return tex;
}

   Renderer, scene, camera
   ===================================================================== */
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
document.body.appendChild(renderer.domElement);
const canvas = renderer.domElement;
canvas.setAttribute('aria-label', 'Interactive 3D corgi rump. Drag to orbit, click the dog to make it wiggle.');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, 1, 0.05, 60);

const LIGHT = {
  keyDir: new THREE.Vector3(0.45, 0.85, 0.6).normalize(),
  keyCol: new THREE.Vector3(1.0, 0.87, 0.72).multiplyScalar(2.25),
  fillDir: new THREE.Vector3(-0.8, 0.35, -0.3).normalize(),
  fillCol: new THREE.Vector3(0.46, 0.48, 0.58).multiplyScalar(0.56),
  skyCol: new THREE.Vector3(0.6, 0.64, 0.74).multiplyScalar(0.72),
  gndCol: new THREE.Vector3(0.62, 0.5, 0.38).multiplyScalar(0.56),
  rimDir: new THREE.Vector3(-0.25, 0.45, -0.86).normalize(),
  rimCol: new THREE.Vector3(1.0, 0.85, 0.68).multiplyScalar(0.5),
};
const EXPOSURE = 0.92;
const GROUND_ALB = rgb(150, 136, 118);
const acesJ = x => clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0, 1);
const lin2srgb = c => (c <= 0.0031308 ? c * 12.92 : 1.055 * Math.pow(c, 1 / 2.4) - 0.055);
const BG = new THREE.Vector3(
  ...['x', 'y', 'z'].map(k => lin2srgb(acesJ(GROUND_ALB[k] * (LIGHT.keyCol[k] * LIGHT.keyDir.y + LIGHT.skyCol[k]) * EXPOSURE))));
renderer.setClearColor(new THREE.Color().setRGB(BG.x, BG.y, BG.z, THREE.SRGBColorSpace), 1);
document.body.style.background = `rgb(${Math.round(BG.x * 255)},${Math.round(BG.y * 255)},${Math.round(BG.z * 255)})`;

const GLSL_COMMON = /* glsl */`
vec3 aces(vec3 x){ return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14), 0.0, 1.0); }
vec3 toSRGB(vec3 c){ return mix(c*12.92, 1.055*pow(c, vec3(1.0/2.4)) - 0.055, step(0.0031308, c)); }
`;

const FUR_VS = /* glsl */`
precision highp float;
precision highp int;
uniform mat4 viewMatrix;
uniform mat4 projectionMatrix;
uniform vec3 cameraPosition;
uniform mat4 uBones[9];
uniform vec3 uBoneLag[9];
uniform vec3 uJig[4];
uniform float uShells;
uniform float uInstOffset;
uniform float uBreath;
uniform vec3 uKeyDir, uKeyCol, uFillDir, uFillCol, uSkyCol, uGndCol, uRimDir, uRimCol;
in vec3 position;
in vec3 normal;
in vec4 aSkinI;
in vec4 aSkinW;
in vec4 aFlow;
in vec4 aFur;
in vec4 aCoat;
in vec4 aLight;
in vec4 aJig;
out vec3 vRest;
out vec3 vLight;
out vec3 vSpec;
out vec4 vCoat;
out vec3 vFur;
out float vFade;
out float vTone;
out float vNV;
out float vRad;
void main(){
  float h = (float(gl_InstanceID) + uInstOffset) / uShells;
  ivec4 bi = ivec4(aSkinI + 0.5);
  vec4 w = aSkinW;
  mat4 S = uBones[bi.x]*w.x + uBones[bi.y]*w.y + uBones[bi.z]*w.z + uBones[bi.w]*w.w;
  vec3 lagB = uBoneLag[bi.x]*w.x + uBoneLag[bi.y]*w.y + uBoneLag[bi.z]*w.z + uBoneLag[bi.w]*w.w;
  vec3 lagJ = uJig[0]*aJig.x + uJig[1]*aJig.y + uJig[2]*aJig.z + uJig[3]*aJig.w;
  mat3 R = mat3(S);
  vec3 n = normalize(R * normal);
  vec3 t = R * aFlow.xyz;
  vec3 p = (S * vec4(position, 1.0)).xyz;
  p += lagJ * aFur.w + n * (uBreath * aFur.z);
  float L = aFur.x;
  float lift = aFlow.w;
  vec3 d0 = normalize(n * lift + t * (1.0 - lift));
  vec3 bend = vec3(0.0, -0.2, 0.0) + (lagB * 1.2 + lagJ * 1.5) / max(L, 0.012);
  vec3 d = d0 + bend * h;
  d += n * max(0.0, 0.3 * length(d) - dot(d, n));
  d = normalize(d);
  vec3 pw = p + d * (L * h);
  vec3 V = normalize(cameraPosition - pw);
  float sh = mix(aLight.y, 1.0, 0.3 * h);
  float ao = mix(aLight.x, 1.0, 0.45 * h);
  float ndl = dot(n, uKeyDir);
  float diff = clamp((ndl + 0.42) / 1.42, 0.0, 1.0);
  vec3 light = uKeyCol * diff * diff * sh;
  light += uFillCol * clamp((dot(n, uFillDir) + 0.35) / 1.35, 0.0, 1.0) * ao;
  light += mix(uGndCol, uSkyCol, n.y * 0.5 + 0.5) * ao;
  float occ = mix(mix(0.8, 0.36, smoothstep(0.004, 0.026, L)), 1.0, pow(h, 0.65));
  float nv = clamp(dot(n, V), 0.0, 1.0);
  float rim = pow(1.0 - nv, 3.0) * (0.35 + 0.65 * h);
  vLight = light * occ + uRimCol * rim * clamp(dot(n, uRimDir) + 0.65, 0.0, 1.0) * ao;
  vec3 H = normalize(uKeyDir + V);
  float th = dot(d, H);
  float sTH = sqrt(max(0.0, 1.0 - th * th));
  vSpec = uKeyCol * sh * (pow(sTH, 70.0) * 0.05 + pow(sTH, 9.0) * 0.012) * h * clamp(ndl + 0.35, 0.0, 1.0);
  vRest = position;
  vCoat = aCoat;
  vFur = vec3(h, L, aFur.y);
  vTone = aLight.z;
  vNV = nv;
  vRad = length(vec2(position.x / 0.085, (position.y - 0.19) / 0.074));
  vFade = smoothstep(-0.3, -0.115, position.z);
  gl_Position = projectionMatrix * viewMatrix * vec4(pw, 1.0);
}`;

const FUR_FS = /* glsl */`
precision highp float;
precision highp sampler3D;
uniform sampler3D uStrand;
uniform float uTile;
uniform vec3 uRed, uTan, uBlack, uWhite, uCream, uTip, uPad;
uniform float uSable;
uniform float uExposure;
uniform vec3 uBg;
uniform float uPass;
in vec3 vRest;
in vec3 vLight;
in vec3 vSpec;
in vec4 vCoat;
in vec3 vFur;
in float vFade;
in float vTone;
in float vNV;
in float vRad;
out vec4 fragColor;
${GLSL_COMMON}
float sel(float m, float r){ return clamp((m * 1.25 - 0.12 - r) * 6.0 + 0.5, 0.0, 1.0); }
void main(){
  float h = vFur.x;
  // pass 0: opaque skin layer of the solid body; pass 1: skin layer of the fading front;
  // pass 2: all fur shells, alpha blended inside-out over the skin layer;
  // pass 3: inside of the solid body, only ever seen end-on through the fading front
  if (uPass < 1.5 && ((uPass < 0.5) != (vFade > 0.999))) discard;
  if (uPass > 2.5 && vFade < 0.999) discard;
  vec4 s = texture(uStrand, vRest / uTile);
  float r1 = s.g, r2 = s.b, cd = s.a;
  float alpha = 1.0;
  float hn = 0.0;
  if (h > 0.0) {
    if (vFur.y < 0.0015) discard;
    float sl = mix(0.42, 1.0, r1) * mix(1.0, 0.62, smoothstep(0.3, 0.9, cd)) * mix(0.3, 1.0, vFade);
    if (h > sl || r1 > vFade * 1.25) discard;
    hn = h / sl;
    float rad = 0.6 * (1.0 - 0.8 * pow(hn, 1.35));
    float aa = fwidth(s.r) * 0.7 + 0.02;
    alpha = smoothstep(rad + aa, rad - aa, s.r);
    if (alpha < 0.01) discard;
  }
  float rw = fract(r2 * 7.31 + 0.13), rd = fract(r2 * 3.17 + 0.71), rt = fract(r2 * 5.53 + 0.37);
  float ws = vCoat.x, ds = vCoat.y, ts = vCoat.z;
  if (h > 0.0) { ws = sel(ws, rw); ds = sel(ds, rd); ts = sel(ts, rt); }
  vec3 c = mix(uRed, uTan, ts) * vTone;
  c = mix(c, uBlack, ds * (1.0 - uSable));
  c = mix(c, mix(uWhite, uCream, vCoat.w), ws);
  // paler, softer undercoat near the roots
  c = mix(mix(c, vec3(dot(c, vec3(0.33))), 0.25) * 1.1 + 0.015, c, smoothstep(0.0, 0.45, hn));
  // dark-tipped guard hairs (sable, and light ticking on reds)
  float tip = smoothstep(0.18, 0.7, hn) * vCoat.y * uSable * (1.0 - ws) * step(0.12, r1);
  c = mix(c, uTip, tip * 0.94);
  c *= 0.86 + 0.28 * fract(r2 * 11.7 + r1 * 3.1);
  c = mix(c, uPad, vFur.z);
  vec3 col = c * vLight + vSpec;
  vec3 outc = toSRGB(aces(col * uExposure));
  if (uPass < 0.5) { fragColor = vec4(outc, 1.0); return; }
  if (uPass > 2.5) { fragColor = vec4(mix(uBg, outc * 0.92, 0.85 * smoothstep(0.5, 1.05, vRad)), 1.0); return; }

  // grazing parts of the fading front thin out first, so seen end-on it dissolves softly

const GROUND_VS = /* glsl */`
precision highp float;

uniform mat4 viewMatrix;

const GROUND_FS = /* glsl */`
precision highp float;
uniform vec4 uSph[15];

class Spring {
  constructor(k, c, max) { this.k = k; this.c = c; this.max = max; this.x = new THREE.Vector3(); this.v = new THREE.Vector3(); this.prev = new THREE.Vector3(); this.ok = false; }
  step(anchor, dt, out) {

    const n = Math.max(1, Math.ceil(dt / (1 / 240))), h = dt / n;
    for (let i = 1; i <= n; i++) {

      this.v.x += (this.k * (ax - this.x.x) - this.c * this.v.x) * h;
      this.v.y += (this.k * (ay - this.x.y) - this.c * this.v.y) * h;
      this.v.z += (this.k * (az - this.x.z) - this.c * this.v.z) * h;
      this.x.addScaledVector(this.v, h);
    }
    this.prev.copy(anchor);
    out.subVectors(this.x, anchor);
    const l = out.length();
    if (l > this.max) { out.multiplyScalar(this.max / l); this.x.copy(anchor).add(out); this.v.multiplyScalar(0.7); }
  }

    make: r => ({ H: lerp(0.032, 0.046, r()), tc: lerp(0.17, 0.24, r()), air: lerp(0.24, 0.3, r()), asym: lerp(-0.04, 0.04, r()),
      wig: lerp(3.5, 5, r()), dir: sideOf(r), pitch: lerp(0.03, 0.07, r()) }),
    dur: p => p.tc + p.air + 1.0,
    eval(p, t, o, A) {
      const c0 = -0.02 * Math.min(A, 1.4);
      let y = 0, pitch = 0;
      const tl = p.tc + p.air;
      if (t < p.tc) { y = c0 * sstep(0, p.tc, t); pitch = 0.03 * sstep(0, p.tc, t); }
      else if (t < tl) { const u = (t - p.tc) / p.air; y = lerp(c0, -0.008, u) + 4 * u * (1 - u) * p.H * A; pitch = lerp(0.03, -p.pitch, u); }
      else { const u = t - tl; const k = Math.exp(-u * 4.2); y = -0.008 - 0.016 * Math.sin(u * 13) * k * A; pitch = -p.pitch * Math.cos(u * 11) * k; }
      y *= 1 - sstep(p.tc + p.air + 0.75, p.tc + p.air + 1.0, t);
      o.ty += y;
      o.pitch += pitch;
      const air = t > p.tc && t < tl ? Math.sin(Math.PI * (t - p.tc) / p.air) : 0;
      o.liftL += Math.max(0, air * 0.012 * A * (1 + p.asym * 10));
      o.liftR += Math.max(0, air * 0.012 * A * (1 - p.asym * 10));
      o.fwdL += air * 0.006; o.fwdR += air * 0.006;
      const u = Math.max(0, t - tl), w = Math.sin(TAU * p.wig * u) * Math.exp(-u * 3.2) * sstep(0, 0.08, u) * A * p.dir;

  },
  // happy tippy-taps: alternate paw lifts with weight shifting onto the planted leg
  taps: {
    make: r => ({ f: lerp(2.4, 3.3, r()), n: 3 + Math.floor(r() * 3), lift: lerp(0.014, 0.021, r()), start: sideOf(r), sway: lerp(0.008, 0.013, r()) }),
    dur: p => p.n / p.f + 0.25,
    eval(p, t, o, A) {

      const l = Math.max(0, Math.sin(ph)), r = Math.max(0, -Math.sin(ph));
      const a = p.start > 0 ? l : r, b = p.start > 0 ? r : l;
      o.liftL += Math.pow(a, 1.5) * p.lift * e; o.liftR += Math.pow(b, 1.5) * p.lift * e;
      o.fwdL += Math.pow(a, 1.5) * 0.008 * e; o.fwdR += Math.pow(b, 1.5) * 0.008 * e;
      const sh = (Math.pow(b, 1.2) - Math.pow(a, 1.2)) * e;   // shift onto the planted leg
      o.tx += sh * p.sway; o.roll += sh * 0.06; o.yaw += sh * 0.035;

      o.syaw += sh * 0.02;
    },
  },
  // rump roll: hips trace a loop, a hula-ish figure with the tail counter-swinging
  hula: {
    make: r => ({ f: lerp(1.3, 1.9, r()), cyc: 2 + Math.floor(r() * 2), A: lerp(0.021, 0.028, r()), dir: sideOf(r), lag: lerp(0.5, 1.1, r()) }),
    dur: p => p.cyc / p.f + 0.2,
    eval(p, t, o, A) {
      const D = p.cyc / p.f + 0.2, e = env(t, 0.25, D, 0.4) * A, ph = TAU * p.f * t * p.dir;
      o.tx += Math.sin(ph) * p.A * e;
      o.tz += Math.cos(ph) * p.A * 0.45 * e;
      o.ty += (Math.cos(ph) * 0.5 - 0.5) * 0.011 * e;
      o.roll += Math.sin(ph + 0.6) * 0.13 * e;
      o.yaw += Math.cos(ph) * 0.075 * e;
      o.pitch += Math.cos(ph) * 0.05 * e;
      o.syaw += Math.sin(ph - p.lag) * 0.05 * e;
      o.tail += Math.sin(2 * ph + 1) * 0.4 * e;
    },
  },
  // shake-off: a rolling shake travelling from the front of the body to the rump
  shake: {
    make: r => ({ f: lerp(4.4, 5.6, r()), D: lerp(0.85, 1.2, r()), roll: lerp(0.15, 0.22, r()), dir: sideOf(r) }),
    dur: p => p.D + 0.35,
    eval(p, t, o, A) {
      const e = Math.pow(Math.sin(Math.PI * clamp(t / p.D, 0, 1)), 1.4) * A, s = e * p.dir, ph = TAU * p.f * t;

      o.roll += Math.sin(ph - 0.75) * p.roll * s;
      o.yaw += Math.sin(ph - 0.75 + 1.57) * 0.035 * s;
      o.syaw += Math.sin(ph + 1.57) * 0.025 * s;
      o.tail += Math.sin(ph - 1.3) * 0.5 * s;
      o.ty += -0.005 * e;
      const st = Math.max(0, t - p.D);
      o.ty += -Math.sin(st * 12) * Math.exp(-st * 6) * 0.004 * A;

  },
};
const WIGGLE_NAMES = Object.keys(WIGGLES);

const behaviour = {
  time: 0, excite: 0, active: [], last: null,
  breathPhase: 0,
  shift: 0, shiftV: 0, shiftTarget: 0, nextShift: 1.5 + 3 * rngIdle(),
  twitchAt: 3 + 5 * rngIdle(), twitchT: -1, twitchDir: 1,
};
function triggerWiggle(forced) {
  const b = behaviour;
  b.excite = Math.min(b.excite + 0.38, 1.6);
  const r = rngWiggle;
  const pickR = r();
  let name = forced;
  if (!WIGGLES[name]) {
    const choices = WIGGLE_NAMES.filter(n => n !== b.last);
    name = choices[Math.floor(pickR * choices.length) % choices.length];
  }
  const p = WIGGLES[name].make(r);
  const E = Math.min(b.excite, 1.3);
  const amp = lerp(0.85, 1.12, r()) * (1 + 0.5 * E);
  const speed = lerp(0.9, 1.12, r()) * (1 + 0.28 * E);
  for (const w of b.active) if (w.fade < 0) w.fade = b.time;
  b.active.push({ name, p, t0: b.time, amp, speed, fade: -1 });
  b.last = name;
}
function updateBehaviour(dt, P) {
  const b = behaviour;
  b.time += dt;
  b.excite *= Math.exp(-dt / 2.4);
  for (const k of POSE_KEYS) P[k] = 0;
  // breathing (pants when excited)
  const pant = sstep(0.25, 1.1, b.excite);
  b.breathPhase += TAU * lerp(0.32, 2.6, pant) * dt;
  const br = Math.sin(b.breathPhase);
  furUniforms.uBreath.value = br * lerp(0.0028, 0.0018, pant);
  P.ty += br * 0.0007;
  // tiny postural sway
  P.yaw += 0.006 * Math.sin(b.time * 0.71) + 0.004 * Math.sin(b.time * 1.13 + 1.0);
  P.roll += 0.005 * Math.sin(b.time * 0.53 + 2.0);
  // occasional weight shifts between the hind legs
  if (b.time > b.nextShift) {
    const r = rngIdle();
    b.shiftTarget = r < 0.3 ? 0 : (r < 0.65 ? -1 : 1) * (0.55 + 0.45 * rngIdle());
    b.nextShift = b.time + 2.5 + 5 * rngIdle();
  }
  const w = 3.2;
  b.shiftV += (w * w * (b.shiftTarget - b.shift) - 2 * w * b.shiftV) * dt;
  b.shift += b.shiftV * dt;
  P.tx += b.shift * 0.008;
  P.roll += b.shift * 0.035;
  P.yaw += b.shift * 0.012;
  P.syaw += b.shift * 0.006;
  // tail stub twitches; a contented wag while still excited
  if (b.time > b.twitchAt) { b.twitchT = 0; b.twitchDir = rngIdle() < 0.5 ? -1 : 1; b.twitchAt = b.time + 3 + 6 * rngIdle(); }
  if (b.twitchT >= 0) { b.twitchT += dt; P.tail += Math.sin(b.twitchT * 38) * Math.exp(-b.twitchT * 5) * 0.22 * b.twitchDir; if (b.twitchT > 1.2) b.twitchT = -1; }
  P.tail += Math.sin(b.time * TAU * 4.6) * 0.28 * sstep(0.1, 0.9, b.excite);
  P.yaw += Math.sin(b.time * TAU * 2.2) * 0.012 * sstep(0.3, 1.2, b.excite);
  // active wiggles (additive layers with cross-fades)
  const tmp = behaviour.tmp || (behaviour.tmp = {});
  for (let i = b.active.length - 1; i >= 0; i--) {
    const W = b.active[i], def = WIGGLES[W.name];
    const lt = (b.time - W.t0) * W.speed;
    let wt = 1;
    if (W.fade >= 0) wt = 1 - sstep(0, 0.28, b.time - W.fade);
    if (lt > def.dur(W.p) || wt <= 0) { b.active.splice(i, 1); continue; }
    for (const k of POSE_KEYS) tmp[k] = 0;
    def.eval(W.p, lt, tmp, W.amp);
    for (const k of POSE_KEYS) P[k] += tmp[k] * wt;
  }
  P.tx = clamp(P.tx, -0.035, 0.035); P.tz = clamp(P.tz, -0.02, 0.02); P.ty = clamp(P.ty, -0.032, 0.06);
  P.yaw = clamp(P.yaw, -0.17, 0.17); P.roll = clamp(P.roll, -0.26, 0.26); P.pitch = clamp(P.pitch, -0.12, 0.12);
  P.syaw = clamp(P.syaw, -0.1, 0.1); P.sroll = clamp(P.sroll, -0.22, 0.22); P.tail = clamp(P.tail, -0.8, 0.8);
  P.liftL = clamp(P.liftL, 0, 0.03); P.liftR = clamp(P.liftR, 0, 0.03);
}

/* =====================================================================
   Camera orbit (360° azimuth, 3°..70° elevation, fixed distance, no zoom)
   ===================================================================== */
const TARGET = new THREE.Vector3(0, 0.145, -0.1);
const CAM_DIST = 0.93;
const EL_MIN = THREE.MathUtils.degToRad(3), EL_MAX = THREE.MathUtils.degToRad(70);
const orbit = { az: THREE.MathUtils.degToRad(12), el: THREE.MathUtils.degToRad(17), vAz: 0, vEl: 0 };
function placeCamera() {
  // elevation is measured at the ground point below the target, so 3° really sits just above the floor
  const h = TARGET.y, ce = Math.cos(orbit.el), se = Math.sin(orbit.el);
  const rg = h * se + Math.sqrt(CAM_DIST * CAM_DIST - h * h * ce * ce);
  camera.position.set(TARGET.x + Math.sin(orbit.az) * ce * rg, se * rg, TARGET.z + Math.cos(orbit.az) * ce * rg);
  camera.lookAt(TARGET);
}

let drag = null, hoverXY = null;
const raycaster = new THREE.Raycaster();
const _ndc = new THREE.Vector2(), _ro = new THREE.Vector3(), _rd = new THREE.Vector3(), _inv = new THREE.Matrix4();
function march(o, d) {
  let t = 0;
  for (let i = 0; i < 160 && t < 4; i++) {
    const x = o.x + d.x * t, y = o.y + d.y * t, z = o.z + d.z * t;
    const s = sdf(x, y, z) - 0.024;
    if (s < 0.0015) return z > -0.25 && y > -0.01;
    t += Math.max(s * 0.9, 0.0015);
  }
  return false;
}
function hitDog(clientX, clientY) {
  const r = canvas.getBoundingClientRect();
  _ndc.set(((clientX - r.left) / r.width) * 2 - 1, -((clientY - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(_ndc, camera);
  const o = raycaster.ray.origin, d = raycaster.ray.direction;
  if (march(o, d)) return true;
  _inv.copy(boneMats[0]).invert();
  _ro.copy(o).applyMatrix4(_inv);
  _rd.copy(d).transformDirection(_inv);
  return march(_ro, _rd);
}
canvas.addEventListener('pointerdown', e => {
  if (drag || (e.pointerType === 'mouse' && e.button !== 0)) return;
  canvas.setPointerCapture(e.pointerId);
  drag = { id: e.pointerId, x: e.clientX, y: e.clientY, lx: e.clientX, ly: e.clientY, lt: performance.now(), t: performance.now(), moved: false };
  orbit.vAz = orbit.vEl = 0;
});
canvas.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) { hoverXY = [e.clientX, e.clientY]; return; }
  const now = performance.now();
  const dx = e.clientX - drag.lx, dy = e.clientY - drag.ly;
  drag.lx = e.clientX; drag.ly = e.clientY;
  if (!drag.moved && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 5) { drag.moved = true; canvas.style.cursor = 'grabbing'; }
  if (drag.moved) {
    const k = Math.PI / Math.max(320, Math.min(canvas.clientWidth, canvas.clientHeight) * 0.95);
    orbit.az -= dx * k;
    orbit.el = clamp(orbit.el + dy * k, EL_MIN, EL_MAX);
    const dtm = Math.max(8, now - drag.lt) / 1000;
    orbit.vAz = lerp(orbit.vAz, -dx * k / dtm, 0.5);
    orbit.vEl = lerp(orbit.vEl, dy * k / dtm, 0.5);
  }
  drag.lt = now;
});
const endDrag = (e, cancelled) => {
  if (!drag || e.pointerId !== drag.id) return;
  const wasClick = !drag.moved && performance.now() - drag.t < 700;
  if (performance.now() - drag.lt > 80) orbit.vAz = orbit.vEl = 0;
  if (canvas.hasPointerCapture(e.pointerId)) canvas.releasePointerCapture(e.pointerId);
  drag = null;
  canvas.style.cursor = 'grab';
  hoverXY = [e.clientX, e.clientY];
  if (!cancelled && wasClick && hitDog(e.clientX, e.clientY)) triggerWiggle();
};
canvas.addEventListener('pointerup', e => endDrag(e, false));
canvas.addEventListener('pointercancel', e => endDrag(e, true));
canvas.addEventListener('pointerleave', () => { hoverXY = null; });
canvas.addEventListener('contextmenu', e => e.preventDefault());

/* =====================================================================
   Sizing, adaptive quality, main loop
   ===================================================================== */
function resize() {
  const w = Math.max(1, document.documentElement.clientWidth), h = Math.max(1, document.documentElement.clientHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, QUALITY[qLevel].dpr));
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  const base = 30;
  camera.fov = w >= h ? base : THREE.MathUtils.radToDeg(2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(base / 2)) / camera.aspect));
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(document.documentElement);
window.addEventListener('resize', resize);
resize();

const perf = { samples: [], lastChange: 0, fps: 0, frames: 0, acc: 0 };
function setQuality(level) {
  qLevel = clamp(level, 0, QUALITY.length - 1);
  applyShellCounts();
  resize();
}
function trackPerf(intervalMs, nowMs) {
  perf.acc += intervalMs; perf.frames++;
  if (perf.acc >= 1000) { perf.fps = perf.frames * 1000 / perf.acc; perf.acc = 0; perf.frames = 0; }
  // Only downgrade on sustained, clearly-slow rendering (well below 30 fps), never on hitches.
  if (document.visibilityState !== 'visible' || intervalMs > 250) return;
  perf.samples.push(intervalMs);
  if (perf.samples.length < 150) return;
  const sorted = perf.samples.slice().sort((a, b) => a - b), median = sorted[sorted.length >> 1];
  perf.samples.length = 0;
  if (median > 40 && nowMs - perf.lastChange > 4000 && qLevel < QUALITY.length - 1) { perf.lastChange = nowMs; setQuality(qLevel + 1); }
}

function simulate(dt) {
  updateBehaviour(dt, pose);
  applyPose(pose);
  updateSprings(dt);
  updateProxies();
}
let lastT = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const interval = now - lastT;
  lastT = now;
  trackPerf(interval, now);
  const dt = Math.min(interval / 1000, 1 / 20);
  if (!drag) {
    orbit.az += orbit.vAz * dt;
    orbit.el = clamp(orbit.el + orbit.vEl * dt, EL_MIN, EL_MAX);
    const k = Math.exp(-dt * 5);
    orbit.vAz *= k; orbit.vEl *= k;
  }
  placeCamera();
  if (dt > 0) simulate(dt);
  if (hoverXY && !drag) { canvas.style.cursor = hitDog(hoverXY[0], hoverXY[1]) ? 'pointer' : 'grab'; hoverXY = null; }
  renderer.render(scene, camera);
}
applyPose(pose);
updateProxies();
placeCamera();
requestAnimationFrame(frame);

// small read-only handle for embedding pages / testing
window.corgi = {
  seed: seedStr, coat,
  get fps() { return perf.fps; },
  get quality() { return qLevel; },
  get excitement() { return behaviour.excite; },
  wiggle: name => triggerWiggle(name),
};
</script>
