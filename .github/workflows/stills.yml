# Captures still images of each run's 3D render (runs/<id>/stills/*.jpg) and commits them,
# so the site can show stills by default and only run a live render when one is clicked.
# Runs on every push to main that touches the runs; existing stills are kept unless forced.
name: Run stills

on:
  push:
    branches: [main]
    paths: [manifest.json, 'runs/**/index.html', scripts/stills.mjs]
  workflow_dispatch:
    inputs:
      force:
        description: Recapture every still, not just missing ones
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: stills
  cancel-in-progress: false

jobs:
  stills:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/stills.mjs ${{ inputs.force && '--force' || '' }}
      - name: Commit new stills
        run: |
          git add runs/*/stills
          if git diff --cached --quiet; then echo "No new stills."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Capture run stills"
          git push
